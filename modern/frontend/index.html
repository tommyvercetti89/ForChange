<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>ForChange Modern</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-area">
                <div class="logo-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>ForChange</h1>
                </div>
            </div>
            <div class="header-actions">
                <button id="theme-toggle" class="icon-btn" title="Toggle Theme">
                    <span id="theme-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </span>
                </button>
            </div>
        </header>

        <!-- Main Body Grid -->
        <main class="app-main">
            <!-- Left Panel: Controls -->
            <section class="control-panel glass-card">
                <h2 class="panel-title">Conversion Settings</h2>

                <!-- Format Selection -->
                <div class="control-group">
                    <label for="target-format">Target Format</label>
                    <select id="target-format" class="custom-select">
                        <optgroup label="Images">
                            <option value="PNG">PNG</option>
                            <option value="JPEG" selected>JPEG</option>
                            <option value="GIF">GIF (Image)</option>
                            <option value="BMP">BMP</option>
                            <option value="TIFF">TIFF</option>
                            <option value="ICO">ICO</option>
                        </optgroup>
                        <optgroup label="Videos">
                            <option value="MP4">MP4</option>
                            <option value="MKV">MKV</option>
                            <option value="AVI">AVI</option>
                            <option value="MOV">MOV</option>
                            <option value="WEBM">WEBM</option>
                            <option value="GIF_VIDEO">GIF (from Video)</option>
                        </optgroup>
                        <optgroup label="Audios">
                            <option value="MP3">MP3</option>
                            <option value="WAV">WAV</option>
                            <option value="AAC">AAC</option>
                            <option value="FLAC">FLAC</option>
                            <option value="OGG">OGG</option>
                            <option value="M4A">M4A</option>
                        </optgroup>
                    </select>
                </div>

                <!-- Video Resolution (visible only for video targets) -->
                <div class="control-group" id="resolution-group" style="display: none;">
                    <label for="video-resolution">Video Resolution</label>
                    <select id="video-resolution" class="custom-select">
                        <option value="original" selected>Original</option>
                        <option value="1080p">1080p (FHD)</option>
                        <option value="720p">720p (HD)</option>
                        <option value="480p">480p (SD)</option>
                        <option value="360p">360p</option>
                    </select>
                </div>

                <!-- Quality / Size -->
                <div class="control-group" id="quality-size-group">
                    <div class="label-row">
                        <label id="quality-size-label" for="quality-size-input">Quality</label>
                        <span id="quality-size-value">80</span>
                    </div>
                    <input type="range" id="quality-size-input" class="custom-slider" min="1" max="100" value="80" />
                </div>

                <!-- Destination Folder -->
                <div class="control-group">
                    <label>Destination Folder</label>
                    <div class="checkbox-row">
                        <input type="checkbox" id="same-dir-checkbox" checked />
                        <label for="same-dir-checkbox">Same as source folder</label>
                    </div>
                    <div class="folder-input-row" id="folder-picker-row" style="display: none;">
                        <input type="text" id="dest-folder-path" placeholder="Select output directory..." readonly />
                        <button id="browse-folder-btn" class="secondary-btn">Browse</button>
                    </div>
                </div>

                <!-- Progress Area (Shown during conversion) -->
                <div id="progress-container" class="progress-container" style="display: none;">
                    <div class="progress-header">
                        <span id="progress-text" class="progress-text">Preparing conversion...</span>
                        <span id="progress-percent" class="progress-percent">0%</span>
                    </div>
                    <div class="progress-bar-track">
                        <div id="progress-bar-fill" class="progress-bar-fill"></div>
                    </div>
                </div>

                <!-- Action Button -->
                <button id="convert-btn" class="primary-btn glow-effect">
                    <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                    <span>Convert All Files</span>
                </button>
            </section>

            <!-- Right Panel: File List and Drop Area -->
            <section class="file-panel glass-card">
                <!-- Empty/Drop Zone State -->
                <div id="drop-zone" class="drop-zone">
                    <div class="drop-content">
                        <div class="drop-icon">
                            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                                <line x1="12" y1="11" x2="12" y2="17"></line>
                                <line x1="9" y1="14" x2="15" y2="14"></line>
                            </svg>
                        </div>
                        <h3>Drag & drop media files here</h3>
                        <p>Supports Images, Videos, and Audio Files</p>
                        <button id="add-files-btn" class="secondary-btn">Or Select Files</button>
                    </div>
                </div>

                <!-- Active File List (Hidden when empty) -->
                <div id="file-list-container" class="file-list-container" style="display: none;">
                    <div class="list-header">
                        <h3>Files to Convert (<span id="file-count">0</span>)</h3>
                        <div class="list-actions">
                            <button id="add-more-btn" class="text-btn">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                                <span>Add More</span>
                            </button>
                            <button id="clear-list-btn" class="text-btn danger-text">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                                <span>Clear All</span>
                            </button>
                        </div>
                    </div>

                    <div class="table-wrapper">
                        <table class="file-table">
                            <colgroup>
                                <col style="width: 36%;">
                                <col style="width: 14%;">
                                <col style="width: 13%;">
                                <col style="width: 18%;">
                                <col style="width: 19%;">
                            </colgroup>
                            <thead>
                                <tr>
                                    <th class="col-name">Name</th>
                                    <th class="col-size">Size</th>
                                    <th class="col-format">Format</th>
                                    <th class="col-status">Status</th>
                                    <th class="col-action text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody id="file-table-body">
                                <!-- Dynamically populated rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <div id="status-bar" class="status-bar">Ready</div>
        </footer>
    </div>

    <!-- Custom Modal Dialog (Replaces native browser alerts) -->
    <div id="custom-modal-backdrop" class="modal-backdrop" style="display: none;">
        <div class="modal-card glass-card">
            <div class="modal-header">
                <div class="modal-title-area">
                    <div id="modal-icon" class="modal-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                    <h3 id="modal-title">Conversion Complete</h3>
                </div>
                <button id="modal-close-btn" class="modal-close-btn" title="Close">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <p id="modal-message">All files have been successfully processed.</p>
                <div id="modal-stats" class="modal-stats" style="display: none;">
                    <div class="stat-item success">
                        <span class="stat-label">Success</span>
                        <span id="modal-stat-success" class="stat-val">0</span>
                    </div>
                    <div class="stat-item fail">
                        <span class="stat-label">Failed</span>
                        <span id="modal-stat-failed" class="stat-val">0</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="modal-action-btn" class="primary-btn modal-action-btn">Done</button>
            </div>
        </div>
    </div>

    <!-- Script loading -->
    <div id="app"></div>
    <script src="./src/main.js" type="module"></script>
</body>
</html>
