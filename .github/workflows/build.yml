name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Package
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: modern/frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Classic Edition
        run: |
          go build -o ForChange.exe

      - name: Build Modern Edition
        run: |
          cd modern
          wails build
          cd ..
          Copy-Item -Path "modern\build\bin\ForChangeModern.exe" -Destination ".\ForChangeModern.exe" -Force

      - name: Build Inno Setup Installers
        run: |
          iscc setup.iss
          iscc setup_modern.iss

      - name: Upload Artifacts (Build Verification)
        if: startsWith(github.ref, 'refs/tags/v') != true
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: dist/*.exe

      - name: Create GitHub Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/QBSoft_ForChange_Setup.exe
            dist/QBSoft_ForChangeModern_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
